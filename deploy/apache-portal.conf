# WAU customer portal: Apache site for the Cloudflare Tunnel.
# Add this at the end of C:\xampp\apache\conf\extra\httpd-vhosts.conf, then restart Apache in the XAMPP Control Panel.
#
# It listens ONLY on 127.0.0.1:8081, so nobody on the network or the internet can reach it directly;
# the tunnel's public hostname portal.wautama.com points to http://127.0.0.1:8081.
# Only C:\wau-portal\public is served: config.php, app\ and check.php are never reachable,
# and wau-erp, phpMyAdmin and anything else in htdocs are not part of this site.

Listen 127.0.0.1:8081

<VirtualHost 127.0.0.1:8081>
    ServerName portal.wautama.com
    DocumentRoot "C:/wau-portal/public"
    DirectoryIndex index.html
    <Directory "C:/wau-portal/public">
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <DirectoryMatch "[/\\]\.git">
        Require all denied
    </DirectoryMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "DENY"
    ErrorLog "logs/wau-portal-error.log"
    CustomLog "logs/wau-portal-access.log" common
</VirtualHost>
