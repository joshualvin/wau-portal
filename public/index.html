<style>
body{margin:0}[hidden]{display:none!important}

/* Layout: app shell with a graphite sidebar (bottom tabs on phones), white panels on a soft canvas, cognac accent shared with wautama.com */
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --ink:#121314; --muted:#62656A; --line:#E4E4E1;
  --side:#18191B; --side-ink:#F4F4F2; --side-muted:#A3A6AB;
  --accent:#C2622D; --accent-soft:#F7E9DF; --on-accent:#FFFFFF;
  --good:#1F7A4D; --good-soft:#E3F2EA; --warn:#9A6400; --warn-soft:#FBF0D9; --bad:#B42318; --bad-soft:#FBE7E5; --info:#2E5AAC; --info-soft:#E6EDFA;
  --display:"Geist","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-lg:22px; --r-md:16px; --r-sm:10px;
  --shadow:0 1px 2px rgba(18,19,20,.04),0 6px 20px rgba(18,19,20,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0E0F; --surface:#17181A; --ink:#EDEDEB; --muted:#9A9DA2; --line:#2A2B2E;
  --side:#121315; --side-ink:#EDEDEB; --side-muted:#9A9DA2;
  --accent:#E07F45; --accent-soft:#2E2019; --on-accent:#140A04;
  --good:#5CC48E; --good-soft:#15291F; --warn:#E3B04B; --warn-soft:#2E2412; --bad:#F2796B; --bad-soft:#331816; --info:#86A9EE; --info-soft:#18213A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0E0F; --surface:#17181A; --ink:#EDEDEB; --muted:#9A9DA2; --line:#2A2B2E;
  --side:#121315; --side-ink:#EDEDEB; --side-muted:#9A9DA2;
  --accent:#E07F45; --accent-soft:#2E2019; --on-accent:#140A04;
  --good:#5CC48E; --good-soft:#15291F; --warn:#E3B04B; --warn-soft:#2E2412; --bad:#F2796B; --bad-soft:#331816; --info:#86A9EE; --info-soft:#18213A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(1.5rem,2.6vw,1.9rem);letter-spacing:-.03em}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-size:.85em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* (no demo banner on the live portal) */
.demo{background:var(--accent-soft);color:var(--ink);font-size:.82rem;text-align:center;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo b{color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:color-mix(in srgb,var(--accent) 88%,black)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-line{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--ink)}
.btn-ghost{background:transparent;color:var(--muted);padding:8px 10px}
.btn-ghost:hover{color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:min(420px,100%);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:clamp(24px,5vw,36px);display:grid;gap:18px}
.brandrow{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:11px;background:var(--side);color:var(--side-ink);display:grid;place-items:center;font-weight:700;font-size:.78rem;position:relative;flex-shrink:0}
.mark::after{content:"";position:absolute;right:6px;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.brandrow b{display:block;font-weight:600;line-height:1.15}
.brandrow small{font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;color:var(--muted)}
label.f{display:grid;gap:6px;font-size:.82rem;font-weight:500;color:var(--muted)}
.inp{width:100%;padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:.93rem}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.inp[readonly]{color:var(--muted)}
textarea.inp{min-height:96px;resize:vertical}
.note{font-size:.84rem;color:var(--muted)}

/* app shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.side .brandrow{padding-inline:8px}
.side .mark{background:var(--side-ink);color:var(--side)}
.side .brandrow small{color:var(--side-muted)}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;border:0;background:transparent;color:var(--side-muted);font-weight:500;font-size:.92rem;cursor:pointer;text-align:left}
.nav button:hover{color:var(--side-ink);background:color-mix(in srgb,var(--side-ink) 6%,transparent)}
.nav button[aria-current="page"]{color:var(--side-ink);background:color-mix(in srgb,var(--side-ink) 10%,transparent)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.nav .count{margin-left:auto;font-family:var(--mono);font-size:.7rem;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;padding:14px 12px;border-radius:14px;background:color-mix(in srgb,var(--side-ink) 6%,transparent);display:grid;gap:4px;font-size:.84rem}
.side-foot b{font-weight:600}
.side-foot span{color:var(--side-muted)}
.side-foot button{justify-self:start;margin-top:4px;background:none;border:0;padding:0;color:var(--side-ink);font-weight:600;cursor:pointer;font-size:.84rem;border-bottom:1px solid currentColor}
svg.i{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .mob-brand{display:none}
.cartbtn{position:relative}
.cartbtn .dot{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.7rem;font-family:var(--mono);display:grid;place-items:center;padding-inline:5px}
.content{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1180px;width:100%;display:grid;gap:22px;align-content:start}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.pagehead>div{min-width:0}
.pagehead p{margin-top:6px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:.86rem;margin-bottom:10px}
.back:hover{color:var(--ink)}

.tabbar{display:none}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top .mob-brand{display:flex}
  .top .page-title{display:none}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--side);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .tabbar button{display:grid;justify-items:center;gap:3px;background:none;border:0;color:var(--side-muted);font-size:.68rem;padding:6px 2px;cursor:pointer;border-radius:10px}
  .tabbar button[aria-current="page"]{color:var(--side-ink)}
  .tabbar button[aria-current="page"] svg{color:var(--accent)}
}

/* panels */
.panel{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px 0}
.panel-b{padding:16px 20px 20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-side{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1000px){.grid-side{grid-template-columns:1fr}}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:16px 18px;display:grid;gap:6px;text-align:left;border:0;cursor:pointer;color:inherit;min-width:0}
.stat:hover{outline:1px solid var(--line)}
.stat .v{font-size:1.6rem;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.stat .v.small{font-size:1.25rem}
.stat .l{font-size:.82rem;color:var(--muted)}
.stat .eyebrow{display:flex;align-items:center;gap:6px}

/* alerts */
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;border-radius:var(--r-md);background:var(--bad-soft);color:var(--ink)}
.alert b{color:var(--bad)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-neutral{background:var(--bg);color:var(--muted)}
.p-accent{background:var(--accent-soft);color:var(--accent)}

/* lists */
.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer;color:inherit}
.row:hover{background:color-mix(in srgb,var(--bg) 60%,transparent)}
.row:first-child{border-top:0}
.row .t{font-weight:600}
.row .s{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row>div{min-width:0}
.row .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:640px){.row{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}.row .hide-sm{display:none}}
.only-narrow{display:none}
@media (max-width:640px){.only-narrow{display:block}.only-wide{display:none}}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.84rem;font-weight:500;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1 1 220px;max-width:320px;margin-left:auto}
@media (max-width:640px){.search{max-width:none;margin-left:0}}

/* product cards */
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.prod{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.swatch{height:92px;position:relative;background-color:var(--c);background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.09) 0 1px,transparent 1.5px),radial-gradient(circle at 70% 60%,rgba(0,0,0,.16) 0 1.2px,transparent 1.7px),linear-gradient(160deg,rgba(255,255,255,.18),rgba(0,0,0,.18));background-size:6px 6px,8px 8px,100% 100%}
.swatch .pill{position:absolute;top:10px;right:10px}
.swatch .brand{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:#fff;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:999px;backdrop-filter:blur(4px)}
.prod-b{padding:14px 16px 16px;display:grid;gap:10px;flex:1}
.prod-b .specs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted)}
.price{display:grid;gap:2px}
.price b{font-size:1.2rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.price b small{font-size:.78rem;font-weight:500;color:var(--muted);letter-spacing:0}
.price span{font-size:.8rem;color:var(--muted)}
.buy{display:flex;gap:8px;align-items:center;margin-top:auto}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg)}
.step button{width:34px;height:36px;border:0;background:none;cursor:pointer;font-size:1.05rem;color:var(--ink)}
.step button:hover{background:var(--line)}
.step output{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:.9rem}
.buy .btn{flex:1}
.incart{font-size:.78rem;color:var(--good);font-weight:600}

/* tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.num,td.r{font-variant-numeric:tabular-nums}
.sub-sm{display:none;font-size:.8rem;color:var(--muted)}
@media (max-width:640px){th.hide-sm,td.hide-sm{display:none}.sub-sm{display:block}td,th{padding:12px 10px}}
.sw-dot{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--c);vertical-align:-2px;margin-right:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:color-mix(in srgb,var(--bg) 60%,transparent)}

/* totals */
.totals{display:grid;gap:8px;font-size:.9rem}
.totals div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.totals .grand{padding-top:10px;border-top:1px solid var(--line);font-size:1.1rem;font-weight:600}
.form{display:grid;gap:14px}

/* timeline */
.timeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;list-style:none;padding:0;margin:0}
.timeline.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
.timeline li{position:relative;padding-top:30px;font-size:.82rem;min-width:0}
.timeline li::before{content:"";position:absolute;top:10px;left:0;right:0;height:2px;background:var(--line)}
.timeline li:first-child::before{left:10px}
.timeline li:last-child::before{right:auto;width:10px}
.timeline li.done::before{background:var(--accent)}
.timeline li .d{position:absolute;top:2px;left:0;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.timeline li.done .d{background:var(--accent);border-color:var(--accent)}
.timeline li.now .d{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}
.timeline b{display:block;font-weight:600}
.timeline span{color:var(--muted);font-size:.78rem}
@media (max-width:640px){
  .timeline,.timeline.t4{grid-template-columns:1fr;gap:14px}
  .timeline li{padding-top:0;padding-left:30px}
  .timeline li::before{top:20px;bottom:-16px;left:8px;right:auto;width:2px;height:auto}
  .timeline li:last-child::before{display:none}
  .timeline li:first-child::before{left:8px}
}

.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.88rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}

.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px}

/* modal + toast */
dialog.m{border:0;border-radius:var(--r-lg);padding:24px;width:min(440px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.m::backdrop{background:rgba(10,10,12,.45);backdrop-filter:blur(3px)}
.m-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:max-content;text-align:center;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:.9rem;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
@media (max-width:860px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media (max-width:520px){.hide-xs{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.prod-b h3{overflow-wrap:anywhere}
button[disabled]{opacity:.55;cursor:wait}

<body>
<div id="root"></div>
<dialog class="m" id="modal"><div id="modal-body"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(function(){
/* WAU customer portal · front end. All data comes from api/portal.php for the signed-in customer only. */
const I={
 home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
 box:'<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5"/><path d="M12 12v9"/>',
 cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h2.6l2.4 12h11.3l2-8.5H6.2"/>',
 truck:'<path d="M2.5 6h11v10h-11z"/><path d="M13.5 9.5h4.2l3.3 3.5V16h-7.5"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/>',
 receipt:'<path d="M6 2.5h12v19l-3-2-3 2-3-2-3 2z"/><path d="M9 7.5h6M9 11.5h6M9 15.5h3"/>',
 ret:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
 out:'<path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/>',
 left:'<path d="M15 5l-7 7 7 7"/>',
 alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/>',
 key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>'
};
const ic=(n)=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const num=n=>Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:1});
const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dt=s=>{if(!s)return '';const [y,m,d]=String(s).slice(0,10).split('-');return `${+d} ${M[+m-1]} ${y}`};
const dtt=s=>s?dt(s)+' '+String(s).slice(11,16):'';
const rolls=n=>n+(n===1?' roll':' rolls');
const STEPS=['Order Received','Order Processed','Shipped','Delivered'];
const PILL={'Order Received':'p-neutral','Order Processed':'p-info','Shipped':'p-accent','Delivered':'p-good','Partly delivered':'p-good',
 'Paid':'p-good','Unpaid':'p-warn','Overdue':'p-bad','Sent':'p-warn','Received by our team':'p-info','SO created':'p-good','Cannot fulfil':'p-bad',
 'Approved':'p-info','Rejected':'p-bad','Resolved':'p-good'};
const pill=s=>`<span class="pill ${PILL[s]||'p-neutral'}">${esc(s)}</span>`;
const stockPill=p=>p.stock==='in'?`<span class="pill p-good">In stock${p.rolls!=null?' · '+p.rolls:''}</span>`:p.stock==='low'?`<span class="pill p-warn">Limited${p.rolls!=null?' · '+p.rolls:''}</span>`:`<span class="pill p-neutral">Ask our team</span>`;

const S={me:null,csrf:'',view:'home',detail:null,cart:{},q:'',stockOnly:false,cache:{},busy:false};
try{S.cart=JSON.parse(localStorage.getItem('wau.cart')||'{}')||{}}catch(_){S.cart={}}
const saveCart=()=>{try{localStorage.setItem('wau.cart',JSON.stringify(S.cart))}catch(_){}};

async function api(a,body,params){
 const url='api/portal.php?a='+a+(params?'&'+new URLSearchParams(params):'');
 const opt=body?{method:'POST',headers:{'Content-Type':'application/json','X-CSRF':S.csrf},body:JSON.stringify(body),credentials:'same-origin'}:{credentials:'same-origin'};
 let r,j;
 try{r=await fetch(url,opt);j=await r.json()}catch(e){throw new Error('Cannot reach the portal. Check your internet connection and try again.')}
 if(r.status===401&&a!=='login'){S.me=null;render();throw new Error('Please sign in again.')}
 if(!j.ok)throw new Error(j.error||'Something went wrong.');
 if(j.csrf)S.csrf=j.csrf;
 return j;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3600)}
function modal(html){$('#modal-body').innerHTML=html;const d=$('#modal');try{d.showModal()}catch(_){d.setAttribute('open','')}}
function closeModal(){const d=$('#modal');try{d.close()}catch(_){d.removeAttribute('open')}}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ---------------- navigation ---------------- */
const NAV=[['home','Dashboard','home'],['products','Products & stock','box'],['orders','Orders','truck'],['invoices','Invoices','receipt'],['returns','Returns','ret']];
const PARENT={order:'orders',request:'orders',invoice:'invoices','rma-new':'returns',rma:'returns'};
function go(view,detail=null){S.view=view;S.detail=detail;try{history.pushState({view,detail},'','#'+view)}catch(_){}render();window.scrollTo(0,0)}
window.addEventListener('popstate',e=>{const s=e.state||{view:'home'};S.view=s.view;S.detail=s.detail;render()});
const cartCount=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);

/* ---------------- sign-in screens ---------------- */
function brand(sub){return `<div class="brandrow"><span class="mark">WAU</span><span><b>Wahyu Agung Utama</b><small>${sub}</small></span></div>`}
function loginView(){
 const c=S.contact||{};
 return `<div class="login"><div class="login-card">${brand('CUSTOMER PORTAL')}
  <div><h1>Sign in</h1><p class="muted" style="margin-top:6px">Order SIMNU synthetic leather, follow your deliveries and check your invoices.</p></div>
  <form id="login" class="form" novalidate>
   <label class="f" for="l-email">Email<input class="inp" id="l-email" type="email" autocomplete="username" required></label>
   <label class="f" for="l-pass">Password<input class="inp" id="l-pass" type="password" autocomplete="current-password" required></label>
   <p class="note" id="l-err" style="color:var(--bad)" hidden></p>
   <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
  <p class="note">Accounts are created by our sales team. Need access or forgot your password? Email <b>${esc(c.email)}</b> or call <b>${esc(c.phone)}</b>.</p>
 </div></div>`;
}
function passwordView(first){
 return `<div class="login"><div class="login-card">${brand(first?'WELCOME':'CHANGE PASSWORD')}
  <div><h1>${first?'Choose your password':'Change password'}</h1><p class="muted" style="margin-top:6px">${first?'You signed in with a temporary password. Choose your own to continue.':'Use at least 8 characters with letters and numbers.'}</p></div>
  <form id="pwform" class="form" novalidate>
   <label class="f" for="p-cur">${first?'Temporary password':'Current password'}<input class="inp" id="p-cur" type="password" autocomplete="current-password" required></label>
   <label class="f" for="p-new">New password<input class="inp" id="p-new" type="password" autocomplete="new-password" required></label>
   <label class="f" for="p-new2">Repeat new password<input class="inp" id="p-new2" type="password" autocomplete="new-password" required></label>
   <p class="note" id="p-err" style="color:var(--bad)" hidden></p>
   <button class="btn btn-primary" type="submit">Save password</button>
   ${first?'<button class="btn btn-ghost" type="button" data-act="logout">Sign out</button>':'<button class="btn btn-ghost" type="button" data-go="home">Cancel</button>'}
  </form></div></div>`;
}

/* ---------------- shell ---------------- */
function shell(inner){
 const n=cartCount(),me=S.me,cur=PARENT[S.view]||S.view;
 const btn=([v,l,i],short)=>`<button data-go="${v}" ${cur===v?'aria-current="page"':''}>${ic(i)}<span>${short?l.split(' ')[0]:l}</span></button>`;
 return `<div class="app">
  <aside class="side">
   <div class="brandrow"><span class="mark">WAU</span><span><b>Customer portal</b><small>WAHYU AGUNG UTAMA</small></span></div>
   <nav class="nav" aria-label="Portal">${NAV.map(x=>btn(x)).join('')}<button data-go="cart" ${cur==='cart'?'aria-current="page"':''}>${ic('cart')}<span>New order</span>${n?`<span class="count">${n}</span>`:''}</button></nav>
   <div class="side-foot"><b>${esc(me.company)}</b><span>${esc(me.name||me.email)}</span><button data-go="password">Change password</button><button data-act="logout">Sign out</button></div>
  </aside>
  <div class="main">
   <header class="top">
    <div class="mob-brand brandrow"><span class="mark">WAU</span><span><b style="font-size:.9rem">Customer portal</b></span></div>
    <span class="page-title muted" style="font-size:.88rem">${esc(me.company)}</span>
    <div style="display:flex;gap:8px;align-items:center">
     <button class="btn btn-line cartbtn" data-go="cart" aria-label="New order, ${n} rolls selected">${ic('cart')}<span class="hide-xs">New order</span>${n?`<span class="dot">${n}</span>`:''}</button>
     <button class="btn btn-ghost" data-act="logout" aria-label="Sign out" title="Sign out">${ic('out')}</button>
    </div>
   </header>
   <main class="content" id="content">${inner}</main>
  </div>
 </div>
 <nav class="tabbar" aria-label="Portal">${NAV.map(x=>btn(x,true)).join('')}</nav>`;
}
const loading=()=>`<div class="panel empty" style="padding:48px 20px">Loading…</div>`;
const failed=(e)=>`<div class="panel empty" style="padding:40px 20px"><p>${esc(e.message)}</p><p style="margin-top:12px"><button class="btn btn-line" data-act="reload">Try again</button></p></div>`;
const syncNote=s=>s?`<p class="note">Updated ${dtt(s)}. Figures refresh every few minutes from our system.</p>`:'';

/* ---------------- views ---------------- */
async function homeView(){
 const d=await api('dashboard');
 const open=d.orders.filter(o=>o.status!=='Delivered');
 const onway=d.orders.filter(o=>o.status==='Shipped');
 const overdue=d.unpaid.filter(i=>i.status==='Overdue');
 const openR=d.returns.filter(r=>!['Resolved','Rejected'].includes(r.status));
 const pendingReq=d.requests.filter(r=>r.status==='Sent'||r.status==='Received by our team');
 const owed=S.showAmounts?d.unpaid.reduce((a,i)=>a+(i.owed||0),0):null;
 return `
 <div class="pagehead"><div><p class="eyebrow">Welcome back</p><h1 style="margin-top:6px">Good to see you${S.me.name?', '+esc(S.me.name.split(' ')[0]):''}</h1></div>
  <button class="btn btn-primary" data-go="products">${ic('cart')}Start a new order</button></div>
 ${overdue.length?`<div class="alert"><span>${ic('alert')} <b>${overdue.length} invoice${overdue.length>1?'s':''} overdue</b> · ${overdue.slice(0,3).map(i=>`${esc(i.invoice)}, due ${dt(i.due)}`).join('; ')}</span><button class="btn btn-line" data-open-inv="${esc(overdue[0].sj)}">View invoice</button></div>`:''}
 <div class="stats">

 if(!S.me){root.innerHTML=loginView();return}
 if(S.me.must_change){root.innerHTML=passwordView(true);return}
 if(S.view==='password'){root.innerHTML=passwordView(false);return}
 const fn=VIEWS[S.view]||VIEWS.home;const my=++seq;
 const same=S.shown===S.view+'|'+S.detail&&$('#content');
 root.innerHTML=shell(same?$('#content').innerHTML:loading());S.shown=S.view+'|'+S.detail;
 try{const html=await fn();if(my===seq)$('#content').innerHTML=html}catch(e){if(my===seq&&S.me)$('#content').innerHTML=failed(e)}
}
async function boot(){
 try{const m=await api('me');S.me=m.user;S.showAmounts=m.show_amounts;S.contact=m.contact}catch(e){$('#root').innerHTML=`<div class="login"><div class="login-card"><h1>Portal unavailable</h1><p class="muted">${esc(e.message)}</p></div></div>`;return}
 const h=location.hash.replace('#','');if(VIEWS[h]&&!['order','request','invoice','rma','rma-new'].includes(h))S.view=h;
 render();
}

/* ---------------- events ---------------- */
document.addEventListener('submit',async e=>{
 e.preventDefault();const f=e.target,btn=f.querySelector('button[type=submit]');
 const err=(id,m)=>{const p=$(id);p.textContent=m;p.hidden=!m};
 if(btn)btn.disabled=true;
 try{
  if(f.id==='login'){err('#l-err','');await api('login',{email:$('#l-email').value,password:$('#l-pass').value});const m=await api('me');S.me=m.user;S.view='home';S.cache={};render();return}
  if(f.id==='pwform'){
   err('#p-err','');if($('#p-new').value!==$('#p-new2').value)throw Object.assign(new Error('The two new passwords are not the same.'),{field:'#p-err'});
   await api('password',{current:$('#p-cur').value,new:$('#p-new').value});S.me.must_change=0;S.view='home';toast('Password saved.');render();return}
  if(f.id==='orderform'){
   const items=Object.keys(S.cart).map(k=>{const [art,color]=k.split('|');return {art,color,rolls:S.cart[k]}});
   const r=await api('order_request',{items,po:$('#o-po').value,deliver_to:$('#o-addr').value,date:$('#o-date').value,notes:$('#o-notes').value});
   S.cart={};saveCart();go('orders');toast(`Order request ${r.ref} sent. Our sales team will create your SO.`);return}
  if(f.id==='rma-form'){
   err('#r-err','');const [art,color]=$('#r-p').value.split('|');
   const r=await api('return_request',{so:$('#r-so').value,art,color,rolls:+$('#r-r').value,reason:$('#r-reason').value,description:$('#r-desc').value});
   go('returns');toast(`Return request ${r.ref} sent.`);return}
 }catch(ex){
  const id=f.id==='login'?'#l-err':f.id==='pwform'?'#p-err':f.id==='rma-form'?'#r-err':null;
  if(id&&$(id))err(id,ex.message);else toast(ex.message);
 }finally{if(btn)btn.disabled=false}
});
document.addEventListener('change',e=>{
 if(e.target.id==='r-so'){const o=S.cache.delivered.find(x=>x.no===e.target.value);$('#r-p').innerHTML=rmaOptions(o);$('#r-r').max=o.lines[0].rolls;$('#r-r').value=1}
 if(e.target.id==='r-p'){const m=+e.target.selectedOptions[0].dataset.max;$('#r-r').max=m;if(+$('#r-r').value>m)$('#r-r').value=m}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#plist').innerHTML=productCards()}});
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.go){go(d.go);return}
 if(d.act==='logout'){try{await api('logout',{})}catch(_){}S.me=null;S.cache={};S.view='home';render();return}
 if(d.act==='reload'){render();return}
 if(d.act==='stockonly'){S.stockOnly=!S.stockOnly;b.setAttribute('aria-pressed',S.stockOnly);$('#plist').innerHTML=productCards();return}
 if(d.openOrder){closeModal();go('order',d.openOrder);return}
 if(d.openReq){go('request',d.openReq);return}
 if(d.openInv){go('invoice',d.openInv);return}
 if(d.openRma){go('rma',d.openRma);return}
 if(d.newRma!==undefined){go('rma-new',d.newRma||null);return}
 if(d.inc||d.dec){const k=d.inc||d.dec,o=document.querySelector(`output[data-q="${CSS.escape(k)}"]`);o.textContent=Math.max(1,Math.min(999,+o.textContent+(d.inc?1:-1)));return}
 if(d.add){const v=+document.querySelector(`output[data-q="${CSS.escape(d.add)}"]`).textContent;S.cart[d.add]=v;saveCart();const p=prod(d.add);
  $('#plist').innerHTML=productCards();document.querySelectorAll('.cartbtn').forEach(x=>{const n=cartCount();x.querySelector('.dot')?x.querySelector('.dot').textContent=n:x.insertAdjacentHTML('beforeend',`<span class="dot">${n}</span>`)});
  toast(`${rolls(v)} of ${p.name} ${p.color_name} in your order`);return}
 if(d.cinc||d.cdec){const k=d.cinc||d.cdec;S.cart[k]=Math.max(1,Math.min(999,(S.cart[k]||1)+(d.cinc?1:-1)));saveCart();render();return}
 if(d.remove){delete S.cart[d.remove];saveCart();render();return}
});
boot();
})();

</script>
</body>
</html>
