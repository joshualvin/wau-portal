<style>
body{margin:0}[hidden]{display:none!important}

/* Layout: app shell with a graphite sidebar (bottom tabs on phones), white panels on a soft canvas, cognac accent shared with wautama.com */
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --ink:#121314; --muted:#62656A; --line:#E4E4E1;
  --side:#18191B; --side-ink:#F4F4F2; --side-muted:#A3A6AB;
  --accent:#C2622D; --accent-soft:#F7E9DF; --on-accent:#FFFFFF;
  --good:#1F7A4D; --good-soft:#E3F2EA; --warn:#9A6400; --warn-soft:#FBF0D9; --bad:#B42318; --bad-soft:#FBE7E5; --info:#2E5AAC; --info-soft:#E6EDFA;
  --display:"Geist","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-lg:22px; --r-md:16px; --r-sm:10px;
  --shadow:0 1px 2px rgba(18,19,20,.04),0 6px 20px rgba(18,19,20,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0E0F; --surface:#17181A; --ink:#EDEDEB; --muted:#9A9DA2; --line:#2A2B2E;
  --side:#121315; --side-ink:#EDEDEB; --side-muted:#9A9DA2;
  --accent:#E07F45; --accent-soft:#2E2019; --on-accent:#140A04;
  --good:#5CC48E; --good-soft:#15291F; --warn:#E3B04B; --warn-soft:#2E2412; --bad:#F2796B; --bad-soft:#331816; --info:#86A9EE; --info-soft:#18213A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0E0F; --surface:#17181A; --ink:#EDEDEB; --muted:#9A9DA2; --line:#2A2B2E;
  --side:#121315; --side-ink:#EDEDEB; --side-muted:#9A9DA2;
  --accent:#E07F45; --accent-soft:#2E2019; --on-accent:#140A04;
  --good:#5CC48E; --good-soft:#15291F; --warn:#E3B04B; --warn-soft:#2E2412; --bad:#F2796B; --bad-soft:#331816; --info:#86A9EE; --info-soft:#18213A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(1.5rem,2.6vw,1.9rem);letter-spacing:-.03em}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-size:.85em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* (no demo banner on the live portal) */
.demo{background:var(--accent-soft);color:var(--ink);font-size:.82rem;text-align:center;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo b{color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:color-mix(in srgb,var(--accent) 88%,black)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-line{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--ink)}
.btn-ghost{background:transparent;color:var(--muted);padding:8px 10px}
.btn-ghost:hover{color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:min(420px,100%);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:clamp(24px,5vw,36px);display:grid;gap:18px}
.brandrow{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:11px;background:var(--side);color:var(--side-ink);display:grid;place-items:center;font-weight:700;font-size:.78rem;position:relative;flex-shrink:0}
.mark::after{content:"";position:absolute;right:6px;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.brandrow b{display:block;font-weight:600;line-height:1.15}
.brandrow small{font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;color:var(--muted)}
label.f{display:grid;gap:6px;font-size:.82rem;font-weight:500;color:var(--muted)}
.inp{width:100%;padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:.93rem}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.inp[readonly]{color:var(--muted)}
textarea.inp{min-height:96px;resize:vertical}
.note{font-size:.84rem;color:var(--muted)}

/* app shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.side .brandrow{padding-inline:8px}
.side .mark{background:var(--side-ink);color:var(--side)}
.side .brandrow small{color:var(--side-muted)}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;border:0;background:transparent;color:var(--side-muted);font-weight:500;font-size:.92rem;cursor:pointer;text-align:left}
.nav button:hover{color:var(--side-ink);background:color-mix(in srgb,var(--side-ink) 6%,transparent)}
.nav button[aria-current="page"]{color:var(--side-ink);background:color-mix(in srgb,var(--side-ink) 10%,transparent)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.nav .count{margin-left:auto;font-family:var(--mono);font-size:.7rem;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;padding:14px 12px;border-radius:14px;background:color-mix(in srgb,var(--side-ink) 6%,transparent);display:grid;gap:4px;font-size:.84rem}
.side-foot b{font-weight:600}
.side-foot span{color:var(--side-muted)}
.side-foot button{justify-self:start;margin-top:4px;background:none;border:0;padding:0;color:var(--side-ink);font-weight:600;cursor:pointer;font-size:.84rem;border-bottom:1px solid currentColor}
svg.i{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .mob-brand{display:none}
.cartbtn{position:relative}
.cartbtn .dot{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.7rem;font-family:var(--mono);display:grid;place-items:center;padding-inline:5px}
.content{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1180px;width:100%;display:grid;gap:22px;align-content:start}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.pagehead>div{min-width:0}
.pagehead p{margin-top:6px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:.86rem;margin-bottom:10px}
.back:hover{color:var(--ink)}
a.back{text-decoration:none;justify-self:start;padding-block:12px;margin-block:-12px -16px} /* 44px tap area, same spacing */

.tabbar{display:none}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top .mob-brand{display:flex}
  .top .page-title{display:none}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--side);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .tabbar button{display:grid;justify-items:center;gap:3px;background:none;border:0;color:var(--side-muted);font-size:.68rem;padding:6px 2px;cursor:pointer;border-radius:10px}
  .tabbar button[aria-current="page"]{color:var(--side-ink)}
  .tabbar button[aria-current="page"] svg{color:var(--accent)}
}

/* panels */
.panel{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px 0}
.panel-b{padding:16px 20px 20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-side{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1000px){.grid-side{grid-template-columns:1fr}}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:16px 18px;display:grid;gap:6px;text-align:left;border:0;cursor:pointer;color:inherit;min-width:0}
.stat:hover{outline:1px solid var(--line)}
.stat .v{font-size:1.6rem;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.stat .v.small{font-size:1.25rem}
.stat .l{font-size:.82rem;color:var(--muted)}
.stat .eyebrow{display:flex;align-items:center;gap:6px}

/* alerts */
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;border-radius:var(--r-md);background:var(--bad-soft);color:var(--ink)}
.alert b{color:var(--bad)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-neutral{background:var(--bg);color:var(--muted)}
.p-accent{background:var(--accent-soft);color:var(--accent)}

/* lists */
.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer;color:inherit}
.row:hover{background:color-mix(in srgb,var(--bg) 60%,transparent)}
.row:first-child{border-top:0}
.row .t{font-weight:600}
.row .s{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row>div{min-width:0}
.row .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:640px){.row{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}.row .hide-sm{display:none}}
.only-narrow{display:none}
@media (max-width:640px){.only-narrow{display:block}.only-wide{display:none}}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.84rem;font-weight:500;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1 1 220px;max-width:320px;margin-left:auto}
@media (max-width:640px){.search{max-width:none;margin-left:0}}

/* product cards */
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.prod{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.swatch{height:92px;position:relative;background-color:var(--c);background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.09) 0 1px,transparent 1.5px),radial-gradient(circle at 70% 60%,rgba(0,0,0,.16) 0 1.2px,transparent 1.7px),linear-gradient(160deg,rgba(255,255,255,.18),rgba(0,0,0,.18));background-size:6px 6px,8px 8px,100% 100%}
.swatch .pill{position:absolute;top:10px;right:10px}
.swatch .brand{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:#fff;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:999px;backdrop-filter:blur(4px)}
.prod-b{padding:14px 16px 16px;display:grid;gap:10px;flex:1}
.prod-b .specs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted)}
.price{display:grid;gap:2px}
.price b{font-size:1.2rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.price b small{font-size:.78rem;font-weight:500;color:var(--muted);letter-spacing:0}
.price span{font-size:.8rem;color:var(--muted)}
.buy{display:flex;gap:8px;align-items:center;margin-top:auto}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg)}
.step button{width:34px;height:36px;border:0;background:none;cursor:pointer;font-size:1.05rem;color:var(--ink)}
.step button:hover{background:var(--line)}
.step output{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:.9rem}
.buy .btn{flex:1}
.incart{font-size:.78rem;color:var(--good);font-weight:600}

/* tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.num,td.r{font-variant-numeric:tabular-nums}
.sub-sm{display:none;font-size:.8rem;color:var(--muted)}
@media (max-width:640px){th.hide-sm,td.hide-sm{display:none}.sub-sm{display:block}td,th{padding:12px 10px}}
.sw-dot{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--c);vertical-align:-2px;margin-right:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:color-mix(in srgb,var(--bg) 60%,transparent)}

/* totals */
.totals{display:grid;gap:8px;font-size:.9rem}
.totals div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.totals .grand{padding-top:10px;border-top:1px solid var(--line);font-size:1.1rem;font-weight:600}
.form{display:grid;gap:14px}

/* timeline */
.timeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;list-style:none;padding:0;margin:0}
.timeline.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
.timeline li{position:relative;padding-top:30px;font-size:.82rem;min-width:0}
.timeline li::before{content:"";position:absolute;top:10px;left:0;right:0;height:2px;background:var(--line)}
.timeline li:first-child::before{left:10px}
.timeline li:last-child::before{right:auto;width:10px}
.timeline li.done::before{background:var(--accent)}
.timeline li .d{position:absolute;top:2px;left:0;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.timeline li.done .d{background:var(--accent);border-color:var(--accent)}
.timeline li.now .d{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}
.timeline b{display:block;font-weight:600}
.timeline span{color:var(--muted);font-size:.78rem}
@media (max-width:640px){
  .timeline,.timeline.t4,.timeline.t3{grid-template-columns:1fr;gap:14px}
  .timeline li{padding-top:0;padding-left:30px}
  .timeline li::before{top:20px;bottom:-16px;left:8px;right:auto;width:2px;height:auto}
  .timeline li:last-child::before{display:none}
  .timeline li:first-child::before{left:8px}
}

.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.88rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}

.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px}

/* modal + toast */
dialog.m{border:0;border-radius:var(--r-lg);padding:24px;width:min(440px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.m::backdrop{background:rgba(10,10,12,.45);backdrop-filter:blur(3px)}
.m-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:max-content;text-align:center;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:.9rem;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
@media (max-width:860px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media (max-width:520px){.hide-xs{display:none}}

.prod-b h3{overflow-wrap:anywhere}
button[disabled]{opacity:.55;cursor:wait}



/* slim portal: order page */
.content{margin:0 auto}
.top .brandrow small{display:block}
.summary{position:sticky;top:84px}
@media (max-width:1000px){.summary{position:static}}
.lines{display:grid;gap:10px;margin:4px 0 2px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.9rem;padding-bottom:10px;border-bottom:1px solid var(--line)}
.cartbar{display:none}
@media (max-width:1000px){
  .cartbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;justify-content:space-between;align-items:center;gap:12px;background:var(--side);color:var(--side-ink);
    padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .content{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}

.qty{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.qty input{width:68px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:.95rem;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty input:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.lq{display:inline-flex;align-items:center;gap:4px}
.line .pill{margin-top:6px}
.oos,.send-err{font-size:.86rem;padding:10px 12px;border-radius:var(--r-sm);color:var(--ink)}
.oos{background:var(--warn-soft)}
.send-err{background:var(--bad-soft);animation:in .2s var(--ease-out,ease-out) backwards}
.rm{border:0;background:none;color:var(--muted);font-size:1.2rem;width:30px;height:34px;cursor:pointer;border-radius:8px}
.rm:hover{background:var(--line);color:var(--ink)}

/* page tabs: New order / My orders */
.tabs{border-bottom:1px solid var(--line);background:var(--bg)}
.tabs>div{max-width:1180px;margin:0 auto;display:flex;gap:4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:12px 14px;font-weight:600;font-size:.92rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button .i{width:18px;height:18px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}
.tabs button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
@media (max-width:640px){.tabs button{flex:1;justify-content:center}}
details.older>summary{cursor:pointer;list-style:none}
details.older>summary::-webkit-details-marker{display:none}
details.older .chev{width:16px;height:16px;vertical-align:-3px;margin-left:6px;transition:transform .15s}
details.older[open] .chev{transform:rotate(180deg)}
details.older>summary{padding-bottom:16px}
details.older[open]>summary{padding-bottom:0}
.timeline li.part::before{background:linear-gradient(90deg,var(--accent),var(--line))}
.timeline li.part .d{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,var(--surface) 50%)}

/* shop: one card per article, its colors as swatches; the cart opens in a side drawer, checkout is its own page */
.content.wide,.tabs>div{max-width:none} /* tabs stay at the left edge on every page, like the header */
@media (min-width:861px){.tabs>div{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}} /* tabs line up with the page edge */
.shop-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px}
.shop-head p{margin-top:4px}
.shop-head .filters{flex:0 1 440px;flex-wrap:nowrap}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,236px),1fr));gap:12px}
.pcard{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.tile{background-color:var(--c,var(--bg));background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.09) 0 1px,transparent 1.5px),radial-gradient(circle at 70% 60%,rgba(0,0,0,.16) 0 1.2px,transparent 1.7px),linear-gradient(160deg,rgba(255,255,255,.18),rgba(0,0,0,.18));background-size:6px 6px,8px 8px,100% 100%}
.mini,.dot-c{background-color:var(--c,var(--bg))} /* swatches are flat, solid colors */
.tile{height:56px;flex:none;display:grid;place-items:center;transition:background-color .25s var(--ease-out)}
.tile.plain span{color:var(--muted);font-size:.82rem;padding:0 12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pbody{padding:12px 14px 14px;display:grid;gap:8px;flex:1;min-width:0;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto 1fr auto}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ptitle h3{overflow-wrap:anywhere;min-width:0}
.ptitle span{flex:none}
.sw{display:flex;flex-wrap:wrap;gap:4px;margin-inline:-4px}
.dot-c{width:32px;height:32px;border:0;cursor:pointer;border-radius:50%;background-clip:content-box;padding:5px;position:relative;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px color-mix(in srgb,var(--ink) 18%,transparent)}
.dot-c[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 0 5px var(--surface)}
.dot-c.oos::after{content:"";position:absolute;inset:5px;border-radius:50%;background:linear-gradient(135deg,transparent calc(50% - 1px),var(--surface) calc(50% - 1px),var(--surface) calc(50% + 1px),transparent calc(50% + 1px))}
.dot-c.inc::before{content:"";position:absolute;right:2px;bottom:2px;width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--surface)}
.dot-c:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.pcolor{font-size:.86rem;display:flex;justify-content:space-between;align-items:center;gap:4px 8px;flex-wrap:wrap}
@media (pointer:coarse){.dot-c{width:40px;height:40px}} /* finger-sized swatches on touch screens */
.buy{display:flex;gap:8px;align-items:center;align-self:end}
.buy .btn{flex:1;min-height:38px;padding-inline:12px}
.buy .qty input{width:58px}
.incart{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--good);font-weight:600;margin-top:-2px}
.incart svg{width:16px;height:16px}
.mini{width:32px;height:32px;border-radius:8px;flex:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 15%,transparent)}
.line{align-items:flex-start}
dialog.drawer{margin:0 0 0 auto;width:min(440px,100vw);height:100dvh;max-height:none;max-width:none;border:0;padding:0;background:var(--surface);color:var(--ink);box-shadow:-20px 0 60px rgba(0,0,0,.25)}
dialog.drawer[open]{animation:drawer .3s var(--ease-out)}
dialog.drawer::backdrop{background:rgba(10,10,12,.45)}
@keyframes drawer{from{transform:translateX(100%)}}
.dr{height:100%;display:flex;flex-direction:column}
.dr-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 12px 14px 20px;border-bottom:1px solid var(--line)}
.dr-b{flex:1;overflow:auto;padding:16px 20px}
.dr-f{display:grid;gap:12px;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.dr-f .grand{border-top:0;padding-top:0}
.sum-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
@media (max-width:1000px){.checkout .summary{order:-1}}
@media (max-width:640px){.shop-head .filters{flex-basis:100%}.pcard{flex-direction:row}.tile{width:40px;height:auto}.tile.plain span{display:none}} /* phones: the color is a strip beside the card */

/* shipments: one card per delivery note (SJ) */
.ships{display:grid;gap:12px;margin-top:14px}
.ship{border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:grid;gap:14px}
.ship-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ship-h b{display:block;font-size:1.05rem;margin-top:2px}
.ship-h small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.timeline.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ship-l{list-style:none;margin:0;padding:10px 0 0;border-top:1px solid var(--line);display:grid;gap:6px;font-size:.86rem}
.ship-l li{display:flex;justify-content:space-between;gap:10px}
.ship-l li>span:last-child{white-space:nowrap;color:var(--muted)}
.sjlist{font-size:.74rem;margin-top:2px}

/* motion: quick feedback and state changes; one authored moment, the status rail filling up to where the rolls are now */
:root{--ease-out:cubic-bezier(.16,1,.3,1);--rise:6px}
@keyframes in{from{opacity:0;transform:translateY(var(--rise))}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pop{40%{transform:scale(1.14)}}
@keyframes toast{from{opacity:0;transform:translate(-50%,8px)}}
.content>*{animation:in .26s var(--ease-out) backwards}
.content>:nth-child(2){animation-delay:40ms}
.content>:nth-child(n+3){animation-delay:80ms}
details.older[open] .rows{animation:in .24s var(--ease-out) backwards}
details.older .chev{transition:transform .22s var(--ease-out)}
.bump{animation:pop .24s var(--ease-out)}
.cartbar{animation:up .3s var(--ease-out) backwards}
.toast:not([hidden]){animation:toast .24s var(--ease-out) backwards}
.toast.out{opacity:0;transition:opacity .16s}
/* the sent check draws itself: circle, then tick */
.drawn circle{stroke-dasharray:57;animation:draw-c .45s var(--ease-out) .08s backwards}
.drawn path{stroke-dasharray:12;animation:draw-t .28s var(--ease-out) .4s backwards}
@keyframes draw-c{from{stroke-dashoffset:57}}
@keyframes draw-t{from{stroke-dashoffset:12}}
/* status rail: each reached dot fills, then the line travels to the next one (200 ms a step) */
.timeline li{--d:calc(var(--i,0) * 200ms + 120ms)}
.timeline li.done::before{background:linear-gradient(var(--accent),var(--accent)) left top/100% 100% no-repeat var(--line);animation:rail-x .18s cubic-bezier(.4,0,.2,1) calc(var(--d) + 20ms) backwards}
.timeline li.done .d{animation:dot .16s var(--ease-out) var(--d) backwards}
.timeline li.done.now .d{animation:dot .16s var(--ease-out) var(--d) backwards,halo .6s var(--ease-out) calc(var(--d) + 120ms) backwards}
.timeline li.part .d{animation:halo .6s var(--ease-out) calc(var(--d) + 120ms) backwards}
@keyframes rail-x{from{background-size:0% 100%}}
@keyframes rail-y{from{background-size:100% 0%}}
@keyframes dot{from{background:var(--surface);border-color:var(--line)}}
@keyframes halo{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}}
@media (max-width:640px){.timeline li.done::before{animation-name:rail-y}}
/* reduced motion: no travel, drawing or scaling; fades and color changes stay so every change is still visible */
@media (prefers-reduced-motion:reduce){
 :root{--rise:0px}
 .timeline li.done::before,.timeline li .d,.drawn circle,.drawn path,.bump{animation:none!important}
 .cartbar,dialog.drawer[open]{animation-name:fade}
 .tile{transition:none}
 details.older .chev{transition:none}
 .btn{transition:background .15s,border-color .15s}.btn:active{transform:none}
}
</style>
</head>
<body>
<div id="root"></div>
<dialog class="m" id="modal"><div id="modal-body"></div></dialog>
<dialog class="drawer" id="cart" aria-labelledby="cart-h"><div class="dr" id="cart-body"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(function(){
/* WAU customer portal · sign in and send an order request. Data comes from api/portal.php for the signed-in customer only. */
const I={
 left:'<path d="M15 5l-7 7 7 7"/>',
 box:'<path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h2.6l2.4 12h11.3l2-8.5H6.2"/>',
 out:'<path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/>',
 key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 10"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:1});
const rolls=n=>n+(n===1?' roll':' rolls');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dt=v=>{if(!v)return '';const [y,m,d]=String(v).slice(0,10).split('-');return `${+d} ${MON[+m-1]} ${y}`};
const STEPS=['Order Received','Order Processed','Shipped','Delivered'];
const PILL={'Order Received':'p-neutral','Order Processed':'p-info','Shipped':'p-accent','Delivered':'p-good','Partly delivered':'p-warn',
 'Being prepared':'p-info','Sent':'p-warn','Received by our team':'p-info','Acknowledged':'p-info','Being processed':'p-info','SO created':'p-good','Cannot fulfil':'p-bad'};
const pill=t=>{if(t==='Received by our team')t='Acknowledged';return `<span class="pill ${PILL[t]||'p-neutral'}">${esc(t)}</span>`};
const stockPill=p=>p.stock==='in'?`<span class="pill p-good">In stock</span>`:`<span class="pill p-neutral">Out of stock</span>`;

const S={me:null,csrf:'',view:'order',products:null,cart:{},q:'',stockOnly:false,sent:null,sel:{}};
try{S.cart=JSON.parse(localStorage.getItem('wau.cart')||'{}')||{}}catch(_){S.cart={}}
const saveCart=()=>{try{localStorage.setItem('wau.cart',JSON.stringify(S.cart))}catch(_){}};

async function api(a,body){
 const opt=body?{method:'POST',headers:{'Content-Type':'application/json','X-CSRF':S.csrf},body:JSON.stringify(body),credentials:'same-origin'}:{credentials:'same-origin'};
 let r,j;
 try{r=await fetch('api/portal.php?a='+a,opt);j=await r.json()}catch(e){throw new Error('Cannot reach the portal. Check your internet connection and try again.')}
 if(r.status===401&&a!=='login'){S.me=null;render();throw new Error('Please sign in again.')}
 if(!j.ok)throw new Error(j.error||'Something went wrong.');
 if(j.csrf)S.csrf=j.csrf;
 return j;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('out');t.hidden=true;void t.offsetWidth;t.hidden=false;
 clearTimeout(toast._t);toast._t=setTimeout(()=>{t.classList.add('out');toast._t=setTimeout(()=>t.hidden=true,160)},3600)}
const bump=el=>{if(!el)return;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}; // a count that changed pops once

/* ---------------- sign-in screens ---------------- */
const brand=sub=>`<div class="brandrow"><span class="mark">WAU</span><span><b>Wahyu Agung Utama</b><small>${sub}</small></span></div>`;
function loginView(){
 const c=S.contact||{};
 return `<div class="login"><div class="login-card"><a class="back" href="https://wautama.com">${ic('left')}Back to wautama.com</a>${brand('CUSTOMER PORTAL')}

 if(!S.products)return Object.keys(S.cart).map(k=>({k,p:null,r:S.cart[k],m:0}));

const HUES=[['hitam|black|jet','#1d1d1f'],['putih|white|off ?white','#efebe3'],['silver|perak','#b7b9bc'],['abu|abu-abu|grey|gray|charcoal','#7d7f82'],
 ['navy|dongker|donker','#1f2a44'],['biru|blue','#2f5d9e'],['tosca|teal|turquoise','#2d7a77'],['maroon|marun|burgundy|wine','#5b1e26'],['pink|merah muda|rose','#d39aa5'],
 ['merah|red','#a3262a'],['ungu|purple|violet','#5b3f73'],['hijau|green','#3e6a45'],['olive|army|zaitun','#5d6236'],['kuning|yellow','#d6af38'],['emas|gold','#b8963e'],
 ['oranye|orange|jingga','#c8642d'],['mocca|moka|mocha|kopi|coffee','#7a5a45'],['coklat|cokelat|brown|choco','#6b4630'],['tan|camel|caramel|karamel','#b07f50'],
 ['khaki|kaki','#a89a6a'],['cream|krem|beige|ivory|gading|natural','#e4d8bf']].map(([k,c])=>[new RegExp('\\b('+k+')\\b'),c]);
function shade(hex,t){const n=parseInt(hex.slice(1),16),f=c=>Math.round(t<0?c*(1+t):c+(255-c)*t);return '#'+[n>>16,n>>8&255,n&255].map(c=>f(c).toString(16).padStart(2,'0')).join('')}
function hueOf(name){
 const s=String(name||'').toLowerCase();
 for(const [re,c] of HUES)if(re.test(s))return /\b(tua|dark|gelap)\b/.test(s)?shade(c,-.3):/\b(muda|light|terang)\b/.test(s)?shade(c,.32):c;
 return '';
}

 const q=S.q.trim().toLowerCase(),groups=new Map();
 for(const p of S.products){

  if(q&&(p.name+' '+p.art+' '+p.color_name+' '+p.color).toLowerCase().includes(q)){g.hit=true;if(!g.match&&(p.color_name+' '+p.color).toLowerCase().includes(q))g.match=p.color}
 }

async function ordersView(){

// One delivery note (SJ) = one shipment, tracked on its own: Prepared -> Shipped -> Delivered.
function shipCard(x,i,n){

 return `<article class="ship" id="sj-${esc(x.sj)}">
  <div class="ship-h"><div><span class="eyebrow">Shipment ${i+1}${n>1?' of '+n:''}</span><b class="mono">${esc(x.sj)}</b><small>${rolls(x.rolls)} · ${num(x.meters)} m</small></div>${pill(st)}</div>

 </article>`;

async function detailView(no){

 // Partly delivered: the steps up to Shipped are done, Delivered is only half reached.

 // Made from a portal request our team has handled: Order Processed is reached on that day, also before the first SJ.
 const fromReq=o.request&&o.status==='Order Received';
 const idx=o.status==='Partly delivered'?2:fromReq?1:STEPS.indexOf(o.status);
 const when=[o.history.received,fromReq?o.request.handled_at:o.history.processed,o.history.shipped,o.history.delivered];
 return `<div><button class="back" data-go="orders">${ic('left')}My orders</button>
  <div class="pagehead"><div><h1>${esc(o.no)}</h1><p class="muted">Ordered ${dt(o.date)} · ${rolls(o.rolls)} · ${num(o.meters)} m${o.request?` · From your request <b class="mono">${esc(o.request.ref)}</b>`:''}</p></div>${pill(fromReq?'Order Processed':o.status)}</div></div>
 <section class="panel"><div class="panel-b"><ol class="timeline t4">${STEPS.map((t,i)=>part&&i===3?`<li class="part now" style="--i:3"><span class="d"></span><b>Partly delivered</b><span>${got} of ${rolls(o.rolls)}${when[3]?' · '+dt(when[3]):''}</span></li>`:`<li class="${i<=idx?'done':''} ${i===idx&&!part?'now':''}" style="--i:${i}"><span class="d"></span><b>${t}</b><span>${i<=idx&&when[i]?dt(when[i]):(i<=idx?'Done':'Pending')}</span></li>`).join('')}</ol>
  ${o.status==='Partly delivered'?`<p class="note" style="margin-top:14px">${rolls(o.rolls_to_come)} still to come on a next delivery.</p>`:''}</div></section>
 <section class="panel"><div class="panel-h"><h2>Products</h2></div><div class="tbl" style="margin-top:8px"><table>
  <thead><tr><th>Product</th><th class="r">Rolls</th><th class="r hide-sm">Sent</th><th class="r">Meters</th></tr></thead>
  <tbody>${o.lines.map(l=>`<tr><td>${esc(l.name)} ${esc(l.color_name)} <span class="mono muted">${esc(l.art)}·${esc(l.color)}</span></td><td class="r">${l.rolls}</td><td class="r hide-sm">${l.on_sj}</td><td class="r">${l.meters?num(l.meters)+' m':''}</td></tr>`).join('')}</tbody>
 </table></div></section>
 <section class="panel"><div class="panel-b"><h2>Shipments${o.sjs.length?` <span class="muted" style="font-weight:400">· ${o.sjs.length} delivery note${o.sjs.length===1?'':'s'}</span>`:''}</h2>
  ${o.sjs.length?`<div class="ships">${o.sjs.map((x,i)=>shipCard(x,i,o.sjs.length)).join('')}</div>`
   :'<p class="muted" style="margin-top:10px">We have your order. A delivery note (SJ) is made when your rolls are prepared; it shows here with its own tracking.</p>'}
  ${o.rolls_to_come>0&&o.sjs.length?`<p class="note" style="margin-top:14px">${rolls(o.rolls_to_come)} not on a delivery note yet. They will come on a next shipment.</p>`:''}
  <p class="note" style="margin-top:14px">Questions? Email ${esc(S.contact.email)} or call ${esc(S.contact.phone)} and mention ${esc(o.no)}.</p>
 </div></section>`;
}
// A request on the same rail as an order: Order Received when it is sent ("Acknowledged by <name>" once a salesperson
// confirms it in WAU ERP: status Received by our team), Order Processed once the SO is made and linked; Shipped and
// Delivered follow on the SO's own page.
function reqRail(r){
 if(r.status==='Cannot fulfil')return '';
 const idx=r.status==='SO created'?1:0, ack=r.status!=='Sent';
 const sub=[ack&&r.status_by?`Acknowledged by ${esc(r.status_by)}`:'',dt(ack&&r.status==='Received by our team'?r.status_at:r.created_at)].filter(Boolean).join(' · ');
 const when=[sub,idx?dt(r.status_at):'',''];
 return `<section class="panel"><div class="panel-b"><ol class="timeline t4">${STEPS.map((t,i)=>`<li class="${i<=idx?'done':''} ${i===idx?'now':''}" style="--i:${i}"><span class="d"></span><b>${t}</b><span>${when[i]||(i<=idx?'Done':'Pending')}</span></li>`).join('')}</ol></div></section>`;
}
async function requestView(id){
 if(!S.reqs)S.reqs=(await api('orders')).requests;
 // Unknown (older than 90 days) → My orders; a request whose SO is made → that SO. render() draws the new view.
 const r=S.reqs.find(x=>x.id==id);if(!r){S.view='orders';render();return ''}
 if(r.status==='SO created'&&r.so_number){S.view='detail';S.detail=r.so_number;render();return ''}
 const msg=r.status==='SO created'?`Your sales order <b class="mono">${esc(r.so_number)}</b> was created.`:r.status==='Cannot fulfil'?'Our team could not fulfil this request.':r.status==='Received by our team'&&r.status_by?`Your request was acknowledged by ${esc(r.status_by)}, who is making your sales order. Tracking starts once the SO is made.`:r.status==='Being processed'?'Our sales team has confirmed your request and is making your sales order. Tracking starts once the SO is made.':'Our sales team checks your request and creates your sales order. Tracking starts once the SO is made.';
 return `<div><button class="back" data-go="orders">${ic('left')}My orders</button>
  <div class="pagehead"><div><h1>${esc(r.ref)}</h1><p class="muted">Sent ${dt(r.created_at)}${r.data.po?' · Your PO '+esc(r.data.po):''}</p></div>${pill(r.status)}</div></div>
 ${reqRail(r)}
 <div class="alert" style="background:var(--${r.status==='Cannot fulfil'?'bad':r.status==='SO created'?'good':'warn'}-soft)"><span>${msg}${r.staff_note?' '+esc(r.staff_note):''}</span>${r.status==='SO created'&&r.so_number?`<button class="btn btn-line" data-open-order="${esc(r.so_number)}">Track ${esc(r.so_number)}</button>`:''}</div>
 <section class="panel"><div class="tbl"><table><thead><tr><th>Product</th><th class="r">Rolls</th><th class="r">Meters</th></tr></thead>
  <tbody>${r.data.items.map(i=>`<tr><td>${esc(i.name)} ${esc(i.color_name)} <span class="mono muted">${esc(i.art)}·${esc(i.color)}</span></td><td class="r">${i.rolls}</td><td class="r">${i.meters?num(i.meters)+' m':''}</td></tr>`).join('')}</tbody></table></div>
  ${r.data.deliver_to||r.data.date||r.data.notes?`<div class="panel-b"><dl class="kv">${r.data.deliver_to?`<dt>Deliver to</dt><dd>${esc(r.data.deliver_to)}</dd>`:''}${r.data.date?`<dt>Wanted by</dt><dd>${dt(r.data.date)}</dd>`:''}${r.data.notes?`<dt>Notes</dt><dd>${esc(r.data.notes)}</dd>`:''}</dl></div>`:''}</section>`;
}

function syncCart(){ // header count, phone cart bar, product cards, open cart and checkout all follow the cart
 const n=cartLines().length,btn=document.querySelector('.cartbtn'),dot=btn&&btn.querySelector('.dot');
 if(dot){if(dot.textContent!==String(n)){dot.textContent=n;bump(dot)}dot.hidden=!n;btn.setAttribute('aria-label',cartLabel())}
 const bar=document.querySelector('.cartbar');
 if(S.view==='order'&&n&&!bar)$('#root').insertAdjacentHTML('beforeend',cartbarHtml());
 else if(bar&&!n)bar.remove();
 else if(bar){const b=bar.querySelector('b');if(b.textContent!==rolls(cartRolls())){b.textContent=rolls(cartRolls());bump(b)}}
 if($('#plist'))redraw('#plist',shopCards);
 if($('#cart').open)redraw('#cart-body',cartHtml,'[data-act=closecart]');
 if(S.view==='checkout'&&$('#content')){const keep={};document.querySelectorAll('#orderform .inp').forEach(x=>keep[x.id]=x.value);
  $('#content').innerHTML=checkoutView();Object.keys(keep).forEach(id=>{const x=document.getElementById(id);if(x)x.value=keep[id]})}
}
// Redraw a region and put focus back on the same control (a swatch, a rolls box, a button), or on a fallback.
function redraw(sel,html,fallback){
 const box=$(sel),a=document.activeElement,card=a&&box.contains(a)&&a.closest('[data-card]');
 const key=!a||!box.contains(a)?null:a.dataset.pick?`[data-pick="${CSS.escape(a.dataset.pick)}"]`:a.dataset.qty?`[data-qty="${CSS.escape(a.dataset.qty)}"]`
  :card?`[data-card="${CSS.escape(card.dataset.card)}"] ${a.name==='rolls'?'input':'button[type=submit]'}`:a.dataset.act?`[data-act="${a.dataset.act}"]`:null;
 box.innerHTML=html();
 if(key||fallback){const x=box.querySelector(key||fallback)||(fallback&&box.querySelector(fallback));if(x&&(key||a===document.body))x.focus({preventScroll:true})}
}
function openCart(){$('#cart-body').innerHTML=cartHtml();const d=$('#cart');if(!d.open)d.showModal()}
async function boot(){
 try{const m=await api('me');S.me=m.user;S.contact=m.contact}catch(e){$('#root').innerHTML=`<div class="login"><div class="login-card"><h1>Portal unavailable</h1><p class="muted">${esc(e.message)}</p></div></div>`;return}
 render();
}

/* ---------------- events ---------------- */
document.addEventListener('submit',async e=>{
 e.preventDefault();const f=e.target,btn=f.querySelector('button[type=submit]');
 if(f.dataset.buy){ // Add to cart / Update cart on a product card: the typed number replaces what is in the cart
  const k=f.dataset.buy,p=prodOf(k),v=f.elements.rolls.value.trim(),had=S.cart[k]||0;
  if(v===''||+v<1){if(had){delete S.cart[k];saveCart();syncCart();toast(`Removed ${p.name} ${p.color_name} from your cart.`)}else{f.elements.rolls.focus();toast('Type how many rolls you need first.')}return}
  setQty(k,v);syncCart();toast(`${had?'Cart updated':'Added to cart'}: ${rolls(S.cart[k])} of ${p.name} ${p.color_name}.`);return}
 const err=(id,m)=>{const p=$(id);if(p){p.textContent=m;p.hidden=!m}};
 const label=btn&&btn.textContent;
 if(btn){btn.disabled=true;if(btn.dataset.busy)btn.textContent=btn.dataset.busy}
 try{
  if(f.id==='login'){err('#l-err','');await api('login',{email:$('#l-email').value,password:$('#l-pass').value});const m=await api('me');S.me=m.user;S.view='order';S.products=null;render();return}
  if(f.id==='pwform'){
   err('#p-err','');if($('#p-new').value!==$('#p-new2').value)throw new Error('The two new passwords are not the same.');
   await api('password',{current:$('#p-cur').value,new:$('#p-new').value});S.me.must_change=0;S.view='order';toast('Password saved.');render();return}
  if(f.id==='orderform'){
   err('#o-err','');
   const items=Object.keys(S.cart).map(k=>{const [art,color]=k.split('|');return {art,color,rolls:S.cart[k]}});
   const r=await api('order_request',{items,po:$('#o-po').value,deliver_to:$('#o-addr').value,date:$('#o-date').value,notes:$('#o-notes').value});
   S.sent={id:r.id,ref:r.ref,rolls:cartRolls()};S.reqs=null;S.cart={};saveCart();S.view='sent';render();window.scrollTo(0,0);return}
 }catch(ex){
  // the error stays next to the button that failed (kept until the next try), the order and typed details stay as they were
  const id={login:'#l-err',pwform:'#p-err',orderform:'#o-err'}[f.id];
  const msg=f.id==='orderform'?'Your order request was not sent. '+ex.message:ex.message;
  if(id&&$(id))err(id,msg);else toast(msg);
 }finally{if(btn){btn.disabled=false;btn.textContent=label}}
});
// My orders: find by SO, SJ, PO or product. Opens closed sections that hold a match.
function findOrders(v){
 const q=v.trim().toLowerCase();let hits=0;
 document.querySelectorAll('#content .rows .row[data-key]').forEach(r=>{const ok=!q||r.dataset.key.includes(q);r.hidden=!ok;if(ok)hits++});
 document.querySelectorAll('#content section.panel, #content details.older').forEach(p=>{const rows=p.querySelectorAll('.row[data-key]');if(!rows.length)return;
  const any=[...rows].some(r=>!r.hidden);p.hidden=!!q&&!any;if(q&&any&&p.tagName==='DETAILS')p.open=true});
 $('#onone').hidden=!q||hits>0;
}
function setQty(k,v){
 const n=Math.max(0,Math.min(999,parseInt(v,10)||0));
 if(n)S.cart[k]=n;else delete S.cart[k];saveCart();
}
document.addEventListener('input',e=>{
 if(e.target.id==='q'){S.q=e.target.value;redraw('#plist',shopCards);return}
 if(e.target.id==='oq'){findOrders(e.target.value);return}
 const k=e.target.dataset&&e.target.dataset.qty;if(!k)return;
 setQty(k,e.target.value); // while typing in the cart only the totals change; the lines redraw when the box is left
 const g=document.querySelectorAll('#cart .grand span');if(g.length){g[0].textContent=rolls(cartRolls());g[1].textContent=num(cartLines().reduce((a,x)=>a+x.m,0))+' m'}
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.qty)syncCart()});
document.addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.fold;if(k){S.folds=S.folds||{};S.folds[k]=e.target.open}},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.qty){e.preventDefault();e.target.blur()}});
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.act==='logout'){try{await api('logout',{})}catch(_){}S.me=null;S.products=null;S.view='order';render();return}
 if(d.act==='password'){S.view='password';render();return}
 if(d.act==='back'||d.act==='new'){S.view='order';render();return}
 if(d.go){S.view=d.go;window.scrollTo(0,0);render();return}
 if(d.openOrder){S.view='detail';S.detail=d.openOrder;window.scrollTo(0,0);render();return}
 if(d.openReq){S.view='request';S.reqId=d.openReq;window.scrollTo(0,0);render();return}
 if(d.act==='reload'){S.products=null;render();return}
 if(d.act==='stockonly'){S.stockOnly=!S.stockOnly;b.setAttribute('aria-pressed',S.stockOnly);redraw('#plist',shopCards);return}
 if(d.act==='cart'){openCart();return}
 if(d.act==='closecart'){$('#cart').close();return}
 if(d.act==='checkout'){$('#cart').close();S.view='checkout';window.scrollTo(0,0);render();return}
 if(d.pick){const [art,color]=d.pick.split('|');S.sel[art]=color;redraw('#plist',shopCards);return}
 if(d.rm){delete S.cart[d.rm];saveCart();syncCart();return}
});
$('#cart').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()}); // tap outside the drawer closes it
boot();
})();

</script>
